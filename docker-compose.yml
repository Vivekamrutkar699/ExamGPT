version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-sqlite-data:/app/data
      - backend-uploads-data:/app/uploads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/examgpt.db
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-examgpt-jwt-development-secret-key-32-chars-long}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  backend-sqlite-data:
  backend-uploads-data:
